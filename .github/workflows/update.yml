name: "Automatic update"
on:
  schedule:
    # every day 00:00 +08:00
    - cron: "0 16 * * *"
  workflow_dispatch:

concurrency: push-to-main

permissions:
  contents: read

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    environment: automation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: staging
          fetch-depth: 0
          token: "${{ secrets.PAT_FOR_AUTOMATED_UPDATE }}"
      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Setup cachix
        uses: cachix/cachix-action@v17
        with:
          name: linyinfeng
          signingKey: "${{ secrets.CACHIX_SIGNING_KEY }}"
      - name: Set swap space
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 10
      - name: Git config
        run: |
          git config --global user.email "nano@linyinfeng.com"
          git config --global user.name "Nano"
      - name: Rebase staging onto main
        run: |
          git rebase origin/main
      - name: Terraform update
        run: |
          nix develop --command maintain terraform init pre-nixos -- -upgrade
          nix develop --command maintain terraform init post-nixos -- -upgrade
          if [ -z "$(git status --porcelain)" ]; then
            echo "repository is clean, skip commit"
          else
            git add --all
            git commit --message "maintain terraform init -upgrade"
          fi
      - name: Patches update
        run: |
          set -e
          nix develop --command maintain patches update
          if [ -z "$(git status --porcelain)" ]; then
            echo "repository is clean, skip commit"
          else
            git add --all
            git commit --message "update-patches"
          fi
      - name: Nix flake update
        run: |
          nix flake update --commit-lock-file
      - name: Push staging and open update PR
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_AUTOMATED_UPDATE }}
          STAGING_HEAD: ${{ steps.checkout.outputs.commit }}
        run: |
          git fetch origin main
          if git diff --quiet origin/main HEAD; then
            echo "no changes relative to main, skip update PR"
            exit 0
          fi
          git push --force-with-lease="refs/heads/staging:$STAGING_HEAD" origin HEAD:staging
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head staging \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --add-label auto-update
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head staging \
              --title "Automatic update" --label auto-update \
              --body "Update Terraform providers, patches and flake inputs. Merge after Nix evaluation and all Hydra staging builds succeed."
          fi
