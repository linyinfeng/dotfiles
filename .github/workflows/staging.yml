name: "Merge to staging"
on:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    environment: automation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: staging
          token: "${{ secrets.PAT_FOR_AUTOMATED_UPDATE }}"
      - name: Rebase and push
        run: |
          git fetch
          git rebase origin/main
          git push --force
