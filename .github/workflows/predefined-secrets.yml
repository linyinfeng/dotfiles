name: "Predefined secrets"
on:
  push:
    branches:
      - "main"
  workflow_dispatch:

concurrency:
  group: push-to-main
  queue: max

permissions:
  contents: write

env:
  SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
  DOTFILES_DIR: dotfiles
  SECRETS_DIR: infrastructure-secrets

jobs:
  extract:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: infrastructure
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          path: dotfiles
          # Use the repository token so generated commits do not trigger workflows.
          token: ${{ github.token }}
      - name: Checkout infrastructure-secrets
        uses: actions/checkout@v7
        with:
          repository: linyinfeng/infrastructure-secrets
          ref: main
          path: infrastructure-secrets
          token: "${{ secrets.PAT_FOR_AUTOMATED_UPDATE }}"
          persist-credentials: false
      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ github.token }}
      - name: Setup cachix
        uses: cachix/cachix-action@v17
        with:
          name: linyinfeng
          skipPush: true
      - name: Extract predefined secrets
        run: nix develop ./dotfiles --command maintain secrets extract predefined
      - name: Commit host secrets
        working-directory: dotfiles
        run: |
          git add -- secrets/predefined/hosts
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name=Nano -c user.email=nano@linyinfeng.com commit -m "Extract predefined host secrets"
          git push origin HEAD:main
