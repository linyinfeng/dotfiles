name: "Terraform pre-nixos"
on:
  push:
    branches:
      - "main"
  workflow_dispatch:

concurrency: push-to-main

env:
  SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
  DOTFILES_DIR: dotfiles
  SECRETS_DIR: infrastructure-secrets
  TERRAFORM_STAGE: pre-nixos

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: infrastructure
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          path: dotfiles
          token: "${{ secrets.PAT_FOR_AUTOMATED_UPDATE }}"
      - name: Setup
        uses: ./dotfiles/.github/actions/terraform-setup
        with:
          stage: pre-nixos
          secrets-repo-token: ${{ secrets.PAT_FOR_AUTOMATED_UPDATE }}
          cachix-signing-key: ${{ secrets.CACHIX_SIGNING_KEY }}
      # init, apply, refresh the encrypted outputs, publish the NixOS inputs through
      # this stage's extraction steps and commit the secrets repo
      - name: Terraform pipe
        run: |
          nix develop ./dotfiles --command maintain terraform pipe pre-nixos -- -auto-approve
      # the NixOS inputs (lib/data/data.json, secrets/terraform/hosts/*.yaml) live in
      # this repo, so they need a commit of their own
      - name: Commit dotfiles
        run: |
          cd "$DOTFILES_DIR"
          git add --all
          if [ -z "$(git status --porcelain)" ]; then
            echo "repository is clean, skip commit"
          else
            git commit --message "Terraform pre-nixos apply"
            git push
          fi
      - name: Notify
        if: failure()
        run: |
          set -e
          nix develop ./dotfiles --command sops exec-file infrastructure-secrets/terraform/outputs/pre-nixos.yaml 'yq ".ntfy_sh_topic_secret.value" "{}" > ntfy-topic-secret'
          curl \
            --header "Title: Terraform pre-nixos" \
            --header "Tags: terraform" \
            --data "pre-nixos apply failed, run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/main-$(cat ntfy-topic-secret)"
